<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NutriFood Health — Reset password</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body class="auth-page"><div class="auth-shell single-auth"><section class="auth-card"><a class="auth-brand" href="{{ url_for('login') }}"><span class="brand-mark"><i class="fa-solid fa-leaf"></i></span><span>NutriFood</span><span>Health</span></a><div class="eyebrow">ACCOUNT RECOVERY</div><h2>Reset your password</h2><p class="auth-sub">Verify your account and choose a new password.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="toast {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><label>Username</label><input name="username" required><label>Security question</label><select name="security_question" required><option value="food">What is your favorite dish?</option><option value="pet">What was your first pet's name?</option><option value="city">In which city were you born?</option></select><label>Answer</label><input name="security_answer" required><label>New password</label><input type="password" name="new_password" minlength="4" required><button class="auth-button"><i class="fa-solid fa-key"></i> Reset password</button></form>
<div class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></div></section></div></body></html>
